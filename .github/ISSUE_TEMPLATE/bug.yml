name: Bug
description: Comportement incorrect ou inattendu
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Sois précis.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Appeler `GET /...`
        2. Avec les paramètres...
        3. Observer la réponse...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Ingestion (adaptateurs, cron, sources de données)
        - Moteur de risque (RiskEngine, seuils)
        - API (endpoints, ApiResource)
        - Doctrine / Entités (Zone, EnvironmentReading, RiskAssessment, DataSource)
        - Documentation
        - Autre
    validations:
      required: true
