<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coastal Sentinel — Démo</title>
<style>
  :root {
    /* Mer (haut) → sable de l'estran (bas), là où vit l'huître */
    --bg-top: #e4f0ee;
    --bg-bottom: #ece3d3;
    /* Nacre : blanc légèrement irisé, reflets crème et bleu-lavande */
    --surface: #ffffff;
    --surface-sheen: linear-gradient(135deg, #ffffff 0%, #f8f4ec 55%, #f1eef6 100%);
    --text: #16302e;
    --muted: #5c706d;
    --border: #dde6e4;
    --accent: #0f6e70;
    --accent-dark: #0b5658;
    /* Coquille : terracotta sable, en écho à la robe de l'huître/moule */
    --shell: #b97d55;
    --danger-bg: #fbeceb;
    --danger-text: #a13d34;
    --danger-border: #f0c3bd;
    --ok-bg: #e6f4ee;
    --ok-text: #1f7a52;
    --ok-border: #bfe3d0;
    --elevation-1: 0 1px 2px rgba(15, 46, 45, 0.06), 0 2px 10px rgba(15, 46, 45, 0.05);
    --elevation-2: 0 2px 4px rgba(15, 46, 45, 0.08), 0 6px 20px rgba(15, 46, 45, 0.07);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1rem 0;
  }

  main {
    width: 100%;
    max-width: 30rem;
  }

  header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.15rem;
  }

  header svg {
    flex-shrink: 0;
    color: var(--accent);
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }

  p.subtitle {
    color: var(--muted);
    margin-top: 0.35rem;
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
  }

  .wave {
    display: block;
    width: 100%;
    height: 14px;
    margin-bottom: 1.75rem;
    color: var(--shell);
    opacity: 0.6;
  }

  form {
    background: var(--surface-sheen);
    border-radius: 1rem;
    padding: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    box-shadow: var(--elevation-1);
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    font-size: 1rem;
    margin-top: 0.4rem;
    background: var(--bg-top);
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15, 110, 112, 0.15);
    background: var(--surface);
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 0.6rem;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--elevation-1);
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
  }

  button:hover:not(:disabled) {
    background: var(--accent-dark);
    box-shadow: var(--elevation-2);
  }

  button:active:not(:disabled) {
    transform: translateY(1px);
  }

  button:disabled {
    opacity: 0.6;
    cursor: wait;
    box-shadow: none;
  }

  #result {
    margin-top: 1.5rem;
  }

  .card {
    border-radius: 1rem;
    padding: 1.75rem;
    background: var(--surface-sheen);
    box-shadow: var(--elevation-1);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
  }

  .badge.ok {
    background: var(--ok-bg);
    color: var(--ok-text);
    border: 1px solid var(--ok-border);
  }

  .badge.danger {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid var(--danger-border);
  }

  .zone-map {
    display: block;
    width: 100%;
    height: auto;
    max-height: 11rem;
    margin-bottom: 1.25rem;
    background: var(--bg-top);
    border-radius: 0.6rem;
  }

  .zone-map path.coastline {
    fill: none;
    stroke: var(--shell);
    stroke-width: 1;
    stroke-opacity: 0.75;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .zone-map path.zone-outline {
    fill: var(--accent);
    fill-opacity: 0.35;
    stroke: var(--accent-dark);
    stroke-width: 1.5;
    stroke-linejoin: round;
  }

  .zone-map .cell-ok {
    fill: var(--ok-text);
    stroke: var(--ok-border);
    stroke-width: 1;
  }

  .zone-map .cell-risque {
    fill: var(--danger-text);
    stroke: var(--danger-border);
    stroke-width: 1;
  }

  .zone-map .cell-absent {
    fill: none;
    stroke: var(--muted);
    stroke-width: 1;
    stroke-dasharray: 1.5 1.5;
    opacity: 0.7;
  }

  dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.6rem 1.25rem;
  }

  dt {
    color: var(--muted);
    font-size: 0.8rem;
  }

  dd {
    margin: 0;
    font-weight: 500;
  }

  footer {
    width: 100%;
    max-width: 30rem;
    margin-top: auto;
    padding: 2rem 0 0.5rem;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .error {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid var(--danger-border);
    border-radius: 1rem;
    padding: 1.1rem 1.5rem;
    box-shadow: var(--elevation-1);
  }
</style>
</head>
<body>
<main>
  <header>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 3C7 3 3 9 3 14a1 1 0 0 0 1 1h1.2M12 3c5 0 9 6 9 11a1 1 0 0 1-1 1h-1.2M12 3v12M8.5 15h-2M17.5 15h-2M6.2 15C6.6 18 9 20.5 12 20.5S17.4 18 17.8 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Coastal Sentinel</h1>
  </header>
  <p class="subtitle">Consultation du risque climatique par bassin conchylicole</p>

  <svg class="wave" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 7 Q 12.5 0, 25 7 T 50 7 T 75 7 T 100 7 T 125 7 T 150 7 T 175 7 T 200 7 T 225 7 T 250 7 T 275 7 T 300 7"
          fill="none" stroke="currentColor" stroke-width="2"/>
  </svg>

  <form id="lookup-form">
    <div>
      <label for="zone">Code de zone</label>
      <input type="text" id="zone" name="zone" value="rade-de-brest" required>
    </div>
    <div>
      <label for="token">Token d'accès</label>
      <input type="password" id="token" name="token" placeholder="Fourni séparément" required>
    </div>
    <button type="submit" id="submit-btn">Vérifier le risque</button>
  </form>

  <div id="result"></div>
</main>

<footer>
  Prévisions océaniques : Copernicus Marine Service (modèle IBI).<br>
  Zones conchylicoles : Sandre / data.gouv.fr.
</footer>

<script>
  const form = document.getElementById('lookup-form');
  const resultEl = document.getElementById('result');
  const submitBtn = document.getElementById('submit-btn');
  const tokenInput = document.getElementById('token');

  // Le token n'est jamais envoyé au-delà de l'appel API ni stocké de façon
  // persistante — seulement conservé le temps de la session du navigateur,
  // pour éviter de le ressaisir entre deux consultations pendant la démo.
  tokenInput.value = sessionStorage.getItem('coastal-sentinel-token') ?? '';

  function renderError(message) {
    resultEl.innerHTML = `<div class="error">${message}</div>`;
  }

  const MOIS_FR = [
    'janvier', 'février', 'mars', 'avril', 'mai', 'juin',
    'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre',
  ];

  function formatDateTime(isoString) {
    const d = new Date(isoString);
    const pad = (n) => String(n).padStart(2, '0');
    const day = pad(d.getDate());
    const month = pad(d.getMonth() + 1);
    const year = pad(d.getFullYear() % 100);
    const hours = pad(d.getHours());
    const minutes = pad(d.getMinutes());
    const seconds = pad(d.getSeconds());
    return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
  }

  // Dates seules (sans heure, ex. fenêtre J+3→J+7) : en toutes lettres,
  // plus lisible pour un public non technique qu'un format numérique.
  function formatDateFr(dateOnlyIso) {
    const [year, month, day] = dateOnlyIso.split('-').map(Number);
    return `${day} ${MOIS_FR[month - 1]} ${year}`;
  }

  // Dessine le contour réel de la zone, replacé dans son contexte
  // géographique (trait de côte réel, OpenStreetMap, simplifié) — SVG
  // auto-contenu, pas de service de carte externe, pas de dépendance
  // réseau pendant la démo (cf. ticket #29).
  function renderZoneMap(polygons, zoneCode, cells) {
    if (!polygons || polygons.length === 0) {
      return '';
    }

    const zonePoints = polygons.flat();
    const zoneLons = zonePoints.map((p) => p[0]);
    const zoneLats = zonePoints.map((p) => p[1]);
    const lonMin0 = Math.min(...zoneLons);
    const lonMax0 = Math.max(...zoneLons);
    const latMin0 = Math.min(...zoneLats);
    const latMax0 = Math.max(...zoneLats);

    // Marge autour de la zone pour donner du contexte géographique
    const marginLon = (lonMax0 - lonMin0) * 0.4 || 0.02;
    const marginLat = (latMax0 - latMin0) * 0.4 || 0.02;
    const lonMin = lonMin0 - marginLon;
    const lonMax = lonMax0 + marginLon;
    const latMin = latMin0 - marginLat;
    const latMax = latMax0 + marginLat;

    const width = 280;
    const height = 200;
    const padding = 8;
    const lonSpan = (lonMax - lonMin) || 1;
    const latSpan = (latMax - latMin) || 1;
    const scale = Math.min((width - 2 * padding) / lonSpan, (height - 2 * padding) / latSpan);
    const offsetX = (width - lonSpan * scale) / 2;
    const offsetY = (height - latSpan * scale) / 2;

    const toX = (lon) => offsetX + (lon - lonMin) * scale;
    const toY = (lat) => height - offsetY - (lat - latMin) * scale;
    const pathFrom = (ring, close) => ring.map(([lon, lat], i) => `${i === 0 ? 'M' : 'L'} ${toX(lon).toFixed(1)} ${toY(lat).toFixed(1)}`).join(' ') + (close ? ' Z' : '');

    const coastPaths = (COASTLINES[zoneCode] || [])
      .map((way) => `<path class="coastline" d="${pathFrom(way, false)}" />`)
      .join('');

    const zonePaths = polygons
      .map((ring) => `<path class="zone-outline" d="${pathFrom(ring, true)}" />`)
      .join('');

    // Mailles de couverture réelle (ticket #33) — vert = sous le seuil,
    // rouge = au-dessus, gris creux = maille non résolue par le modèle
    // (jamais confondu visuellement avec une vraie mesure "ok").
    const cellMarkers = (cells || [])
      .map((cell) => `<circle class="cell cell-${cell.status}" cx="${toX(cell.lon).toFixed(1)}" cy="${toY(cell.lat).toFixed(1)}" r="3.5"><title>${cell.value !== null ? cell.value.toFixed(1) + '°C' : 'Donnée absente'}</title></circle>`)
      .join('');

    return `<svg class="zone-map" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte de la zone">${coastPaths}${zonePaths}${cellMarkers}</svg>`;
  }

  function renderAssessment(data, cells) {
    const risky = data.score > 0;
    const badgeClass = risky ? 'danger' : 'ok';
    const badgeLabel = risky ? 'Risque détecté' : 'Aucun risque';

    resultEl.innerHTML = `
      <div class="card">
        <span class="badge ${badgeClass}">${badgeLabel}</span>
        ${renderZoneMap(data.zonePolygons, data.zone, cells)}
        <dl>
          <dt>Zone</dt><dd>${data.zone}</dd>
          <dt>Type de risque</dt><dd>${data.riskType}</dd>
          <dt>Fenêtre évaluée</dt><dd>${formatDateFr(data.windowStart)} → ${formatDateFr(data.windowEnd)}</dd>
          <dt>Action recommandée</dt><dd>${data.recommendedAction}</dd>
          <dt>Calculé le</dt><dd>${formatDateTime(data.computedAt)}</dd>
        </dl>
      </div>
    `;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const zone = document.getElementById('zone').value.trim();
    // Accepte de coller soit le token brut, soit l'en-tête complet
    // ("Bearer xxx") — évite d'avoir à le retailler à la main.
    const token = tokenInput.value.trim().replace(/^Bearer\s+/i, '');
    sessionStorage.setItem('coastal-sentinel-token', token);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Vérification…';
    resultEl.innerHTML = '';

    try {
      const response = await fetch(`/api/risque/${encodeURIComponent(zone)}`, {
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/json',
        },
      });

      if (response.status === 401) {
        renderError("Token invalide ou manquant.");
      } else if (response.status === 404) {
        renderError(`Zone inconnue : « ${zone} ».`);
      } else if (!response.ok) {
        renderError(`Erreur inattendue (code ${response.status}).`);
      } else {
        const data = await response.json();

        // La couverture est un diagnostic optionnel — son indisponibilité
        // ne doit jamais empêcher d'afficher le verdict principal.
        let cells = [];
        try {
          const coverageResponse = await fetch(`/api/risque/${encodeURIComponent(zone)}/couverture`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
          });
          if (coverageResponse.ok) {
            cells = (await coverageResponse.json()).cells;
          }
        } catch (error) {
          // silencieux : la carte s'affiche quand même sans les mailles
        }

        renderAssessment(data, cells);
      }
    } catch (error) {
      renderError("Impossible de contacter le serveur.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Vérifier le risque';
    }
  });
</script>
