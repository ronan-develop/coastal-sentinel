<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coastal Sentinel — Démo</title>
<style>
  :root {
    /* Mer (haut) → sable de l'estran (bas), là où vit l'huître */
    --bg-top: #e4f0ee;
    --bg-bottom: #ece3d3;
    /* Nacre : blanc légèrement irisé, reflets crème et bleu-lavande */
    --surface: #ffffff;
    --surface-sheen: linear-gradient(135deg, #ffffff 0%, #f8f4ec 55%, #f1eef6 100%);
    --text: #16302e;
    --muted: #5c706d;
    --border: #dde6e4;
    --accent: #0f6e70;
    --accent-dark: #0b5658;
    /* Coquille : terracotta sable, en écho à la robe de l'huître/moule */
    --shell: #b97d55;
    --danger-bg: #fbeceb;
    --danger-text: #a13d34;
    --danger-border: #f0c3bd;
    --ok-bg: #e6f4ee;
    --ok-text: #1f7a52;
    --ok-border: #bfe3d0;
    --elevation-1: 0 1px 2px rgba(15, 46, 45, 0.06), 0 2px 10px rgba(15, 46, 45, 0.05);
    --elevation-2: 0 2px 4px rgba(15, 46, 45, 0.08), 0 6px 20px rgba(15, 46, 45, 0.07);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
  }

  main {
    width: 100%;
    max-width: 30rem;
  }

  header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.15rem;
  }

  header svg {
    flex-shrink: 0;
    color: var(--accent);
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }

  p.subtitle {
    color: var(--muted);
    margin-top: 0.35rem;
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
  }

  .wave {
    display: block;
    width: 100%;
    height: 14px;
    margin-bottom: 1.75rem;
    color: var(--shell);
    opacity: 0.6;
  }

  form {
    background: var(--surface-sheen);
    border-radius: 1rem;
    padding: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    box-shadow: var(--elevation-1);
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    font-size: 1rem;
    margin-top: 0.4rem;
    background: var(--bg-top);
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15, 110, 112, 0.15);
    background: var(--surface);
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 0.6rem;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--elevation-1);
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
  }

  button:hover:not(:disabled) {
    background: var(--accent-dark);
    box-shadow: var(--elevation-2);
  }

  button:active:not(:disabled) {
    transform: translateY(1px);
  }

  button:disabled {
    opacity: 0.6;
    cursor: wait;
    box-shadow: none;
  }

  #result {
    margin-top: 1.5rem;
  }

  .card {
    border-radius: 1rem;
    padding: 1.75rem;
    background: var(--surface-sheen);
    box-shadow: var(--elevation-1);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
  }

  .badge.ok {
    background: var(--ok-bg);
    color: var(--ok-text);
    border: 1px solid var(--ok-border);
  }

  .badge.danger {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid var(--danger-border);
  }

  dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.6rem 1.25rem;
  }

  dt {
    color: var(--muted);
    font-size: 0.8rem;
  }

  dd {
    margin: 0;
    font-weight: 500;
  }

  .error {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid var(--danger-border);
    border-radius: 1rem;
    padding: 1.1rem 1.5rem;
    box-shadow: var(--elevation-1);
  }
</style>
</head>
<body>
<main>
  <header>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 3C7 3 3 9 3 14a1 1 0 0 0 1 1h1.2M12 3c5 0 9 6 9 11a1 1 0 0 1-1 1h-1.2M12 3v12M8.5 15h-2M17.5 15h-2M6.2 15C6.6 18 9 20.5 12 20.5S17.4 18 17.8 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Coastal Sentinel</h1>
  </header>
  <p class="subtitle">Consultation du risque climatique par bassin conchylicole</p>

  <svg class="wave" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 7 Q 12.5 0, 25 7 T 50 7 T 75 7 T 100 7 T 125 7 T 150 7 T 175 7 T 200 7 T 225 7 T 250 7 T 275 7 T 300 7"
          fill="none" stroke="currentColor" stroke-width="2"/>
  </svg>

  <form id="lookup-form">
    <div>
      <label for="zone">Code de zone</label>
      <input type="text" id="zone" name="zone" value="rade-de-brest" required>
    </div>
    <div>
      <label for="token">Token d'accès</label>
      <input type="password" id="token" name="token" placeholder="Fourni séparément" required>
    </div>
    <button type="submit" id="submit-btn">Vérifier le risque</button>
  </form>

  <div id="result"></div>
</main>

<script>
  const form = document.getElementById('lookup-form');
  const resultEl = document.getElementById('result');
  const submitBtn = document.getElementById('submit-btn');
  const tokenInput = document.getElementById('token');

  // Le token n'est jamais envoyé au-delà de l'appel API ni stocké de façon
  // persistante — seulement conservé le temps de la session du navigateur,
  // pour éviter de le ressaisir entre deux consultations pendant la démo.
  tokenInput.value = sessionStorage.getItem('coastal-sentinel-token') ?? '';

  function renderError(message) {
    resultEl.innerHTML = `<div class="error">${message}</div>`;
  }

  function renderAssessment(data) {
    const risky = data.score > 0;
    const badgeClass = risky ? 'danger' : 'ok';
    const badgeLabel = risky ? 'Risque détecté' : 'Aucun risque';

    resultEl.innerHTML = `
      <div class="card">
        <span class="badge ${badgeClass}">${badgeLabel}</span>
        <dl>
          <dt>Zone</dt><dd>${data.zone}</dd>
          <dt>Type de risque</dt><dd>${data.riskType}</dd>
          <dt>Fenêtre évaluée</dt><dd>${data.windowStart} → ${data.windowEnd}</dd>
          <dt>Action recommandée</dt><dd>${data.recommendedAction}</dd>
          <dt>Calculé le</dt><dd>${data.computedAt}</dd>
        </dl>
      </div>
    `;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const zone = document.getElementById('zone').value.trim();
    // Accepte de coller soit le token brut, soit l'en-tête complet
    // ("Bearer xxx") — évite d'avoir à le retailler à la main.
    const token = tokenInput.value.trim().replace(/^Bearer\s+/i, '');
    sessionStorage.setItem('coastal-sentinel-token', token);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Vérification…';
    resultEl.innerHTML = '';

    try {
      const response = await fetch(`/api/risque/${encodeURIComponent(zone)}`, {
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/json',
        },
      });

      if (response.status === 401) {
        renderError("Token invalide ou manquant.");
      } else if (response.status === 404) {
        renderError(`Zone inconnue : « ${zone} ».`);
      } else if (!response.ok) {
        renderError(`Erreur inattendue (code ${response.status}).`);
      } else {
        renderAssessment(await response.json());
      }
    } catch (error) {
      renderError("Impossible de contacter le serveur.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Vérifier le risque';
    }
  });
</script>
</body>
</html>
